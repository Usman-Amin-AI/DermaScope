[server]
# The application enforces a 20 MB per-file limit in Python. This server-level
# limit provides an additional defense against oversized HTTP uploads.
maxUploadSize = 20
fileWatcherType = "none"
headless = true
runOnSave = false

[browser]
gatherUsageStats = false

[theme]
primaryColor = "#0F766E"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F4F6"
textColor = "#111827"
font = "sans serif"
